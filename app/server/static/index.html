<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장중 시세 원인 분석</title>

<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icons/favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0e1116">
<!-- iOS 는 매니페스트를 부분적으로만 본다. 홈 화면 전체화면 실행에 필요. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="왜 움직여">
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262d38;
    --fg: #e6edf3; --dim: #8b98a5; --faint: #5c6773;
    --up: #f0616d; --down: #4a9eff; --accent: #d6a44c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #e2e6ea;
      --fg: #1a1f26; --dim: #5c6773; --faint: #93a1af;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Malgun Gothic", sans-serif;
    line-height: 1.6;
    /* 노치 대응: 홈 화면에서 전체화면으로 뜨면 상단이 잘린다 */
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px
             calc(env(safe-area-inset-bottom, 0px) + 60px);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 19px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.3px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }

  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input {
    flex: 1; padding: 14px 16px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 0 22px; font-size: 15px; font-weight: 600; border: 0;
    border-radius: 10px; background: var(--accent); color: #1a1205; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
  .chip {
    padding: 5px 11px; font-size: 12.5px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--dim);
  }
  .chip:hover { color: var(--fg); border-color: var(--faint); }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; margin-bottom: 14px;
  }
  .ticker { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .tname { font-size: 20px; font-weight: 700; }
  .tcode { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
  .tprice { margin-left: auto; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tchg { font-size: 14px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--dim); }

  .answer { font-size: 17px; font-weight: 600; line-height: 1.55; margin: 0 0 14px; }
  .reason { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .rpoint { flex: 0 0 108px; font-size: 13px; font-weight: 600; color: var(--accent); }
  .rdetail { flex: 1; font-size: 14px; color: var(--fg); }

  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .tag {
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--line); color: var(--dim);
  }

  h2 { font-size: 13px; font-weight: 700; color: var(--dim); margin: 0 0 12px;
       text-transform: uppercase; letter-spacing: .6px; }

  .bar { display: flex; height: 30px; border-radius: 7px; overflow: hidden;
         background: var(--bg); margin-bottom: 12px; }
  .seg { display: flex; align-items: center; justify-content: center;
         font-size: 11.5px; font-weight: 700; color: #0e1116; min-width: 2px; }
  .legend { display: grid; gap: 7px; }
  .lrow { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .lname { flex: 1; }
  .lval { font-variant-numeric: tabular-nums; font-weight: 600; }
  .lshare { color: var(--faint); font-size: 12px; width: 42px; text-align: right;
            font-variant-numeric: tabular-nums; }

  ul.signals { list-style: none; padding: 0; margin: 0; }
  ul.signals li { font-size: 13.5px; color: var(--dim); padding: 6px 0 6px 14px;
                  position: relative; }
  ul.signals li::before { content: "·"; position: absolute; left: 2px; color: var(--accent); }

  .news a { display: flex; gap: 10px; padding: 8px 0; text-decoration: none;
            color: var(--fg); border-top: 1px solid var(--line); font-size: 13.5px; }
  .news a:first-child { border-top: 0; }
  .news a:hover .ntitle { color: var(--accent); }
  .ntime { color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
  .ntitle { flex: 1; }
  .ncat { color: var(--faint); font-size: 11.5px; flex: none; }

  .status { text-align: center; color: var(--dim); padding: 36px 0; font-size: 14px; }
  .err { color: var(--up); }
  .spin { display: inline-block; width: 15px; height: 15px; vertical-align: -2px;
          border: 2px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: r .7s linear infinite; margin-right: 8px; }
  @keyframes r { to { transform: rotate(360deg); } }
  .foot { color: var(--faint); font-size: 11.5px; text-align: center; margin-top: 24px;
          line-height: 1.7; }

  .stamp { display: flex; align-items: center; gap: 8px; margin-top: 10px;
           font-size: 12px; color: var(--faint); }
  .refresh { margin-left: auto; padding: 5px 12px; font-size: 12px; font-weight: 600;
             background: transparent; color: var(--dim); border: 1px solid var(--line);
             border-radius: 7px; }
  .refresh:hover { color: var(--fg); border-color: var(--faint); }

  @media (max-width: 520px) {
    body { padding-left: 12px; padding-right: 12px; }
    h1 { font-size: 17px; }
    .card { padding: 16px; border-radius: 12px; }
    .tprice { font-size: 20px; }
    .tname { font-size: 18px; }
    .answer { font-size: 16px; }
    /* 좁은 화면에서 근거는 세로로 쌓는다 */
    .reason { flex-direction: column; gap: 2px; }
    .rpoint { flex: none; }
    .news a { flex-wrap: wrap; }
    .ncat { width: 100%; padding-left: 44px; }
    button[type=submit] { padding: 0 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>장중 시세 원인 분석</h1>
  <div class="sub">종목을 입력하면 오늘 왜 그렇게 움직이는지 즉답합니다.</div>

  <form id="f">
    <input id="q" placeholder="종목명 또는 코드 (예: 삼성전자, 005930)" autocomplete="off" autofocus>
    <button type="submit" id="go">분석</button>
  </form>
  <div class="chips" id="chips"></div>

  <div id="out"></div>

  <div class="foot" id="usage"></div>

  <div class="foot">
    시세·뉴스는 네이버 금융에서 수집하며 지연될 수 있습니다.<br>
    이 결과는 정보 제공용 분석이며 투자 판단의 근거로 삼지 마십시오.
  </div>

  <!-- 데스크톱 앱에서만 보인다. 작은 창을 작업표시줄로 내려두고 쓰기 때문에,
       끄는 수단이 지금 보고 있는 화면에도 있어야 한다. -->
  <div class="foot" id="quitBar" style="display:none">
    <button type="button" class="chip" id="quitBtn">앱 종료</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const out = $('#out'), form = $('#f'), qEl = $('#q'), goEl = $('#go');

const SAMPLES = ['삼성전자', 'SK하이닉스', '한화오션', 'LG에너지솔루션', '알테오젠', 'HD현대일렉트릭'];
$('#chips').innerHTML = SAMPLES.map(s => `<button type="button" class="chip">${s}</button>`).join('');
$('#chips').addEventListener('click', e => {
  if (!e.target.classList.contains('chip')) return;
  qEl.value = e.target.textContent;
  form.requestSubmit();
});

// 토큰이 켜져 있으면 ?t=... 로 한 번만 받아 저장하고, 이후엔 헤더로 보낸다.
// URL 에 계속 달고 다니면 공유하다 실수로 새어나가기 쉽다.
const TOKEN_KEY = 'stockwhy_token';
(function captureToken() {
  const t = new URLSearchParams(location.search).get('t');
  if (!t) return;
  try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {}
  history.replaceState({}, '', location.pathname);
})();
const token = () => { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } };

const nf = n => n == null ? '-' : n.toLocaleString('ko-KR');
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';

// 이번 질의에 실제로 든 토큰과 비용. 추정이 아니라 API 응답의 usage 값이다.
function costLabel(c) {
  if (!c) return ' · LLM 미사용';
  const tok = `${nf(c.input_tokens)}+${nf(c.output_tokens)} 토큰`;
  if (c.usd == null) return ` · ${tok}`;
  return ` · ${tok} · ${Math.round(c.krw)}원`;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

form.addEventListener('submit', async e => {
  e.preventDefault();
  const q = qEl.value.trim();
  if (!q) return;
  goEl.disabled = true;
  out.innerHTML = `<div class="status"><span class="spin"></span>${esc(q)} 분석 중…</div>`;
  try {
    const tk = token();
    const r = await fetch(`/api/why?q=${encodeURIComponent(q)}`,
                          tk ? { headers: { 'X-Token': tk } } : undefined);
    const data = await r.json();
    if (r.status === 401) {
      throw new Error('접근 토큰이 없거나 틀립니다. PC에서 안내된 주소(?t=...)로 한 번 접속하세요.');
    }
    if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
    render(data);
  } catch (err) {
    out.innerHTML = `<div class="status err">분석 실패: ${esc(err.message)}</div>`;
  } finally {
    goEl.disabled = false;
  }
});

function render(d) {
  const q = d.quote, a = d.attribution, c = a.components, exp = d.explanation;
  const parts = [];

  // 시세 헤더
  parts.push(`<div class="card">
    <div class="ticker">
      <span class="tname">${esc(q.name)}</span>
      <span class="tcode">${esc(q.code)} · ${esc(q.market)}${q.sector_name ? ' · ' + esc(q.sector_name) : ''}</span>
      <span class="tprice ${cls(q.change_rate)}">${nf(q.price)}</span>
    </div>
    <div class="tchg ${cls(q.change_rate)}" style="text-align:right">
      ${q.change > 0 ? '+' : ''}${nf(q.change)} (${q.change_rate > 0 ? '+' : ''}${q.change_rate.toFixed(2)}%)
    </div>
    <div class="stamp">
      <span>${esc((d.as_of || '').slice(11, 16))} 기준 · ${d.elapsed_ms}ms${costLabel(d.cost)}</span>
      <button type="button" class="refresh" id="rf">새로고침</button>
    </div>
  </div>`);

  // 즉답
  const answer = exp && exp.answer ? exp.answer : a.headline;
  let body = `<div class="card"><p class="answer">${esc(answer)}</p>`;
  if (exp && exp.reasons) {
    for (const r of exp.reasons) {
      body += `<div class="reason"><div class="rpoint">${esc(r.point)}</div><div class="rdetail">${esc(r.detail)}</div></div>`;
    }
  }
  const tags = [];
  if (exp && exp.catalyst) tags.push(`촉발 재료: ${exp.catalyst}`);
  if (exp && exp.watch) tags.push(`체크: ${exp.watch}`);
  tags.push(`주도 요인: ${a.driver_label}`);
  tags.push(`확신도: ${exp && exp.confidence ? exp.confidence : a.confidence}`);
  body += `<div class="meta">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></div>`;
  parts.push(body);

  // 등락률 분해
  const comps = [
    ['시장', c.market, '#4a9eff'],
    ['업종초과', c.sector, '#d6a44c'],
    ['종목고유', c.idiosyncratic, '#5ec98a'],
  ];
  const segs = comps.map(([n, o, col]) =>
    o.share > 0.02 ? `<div class="seg" style="width:${(o.share*100).toFixed(1)}%;background:${col}">${o.share > .12 ? n : ''}</div>` : ''
  ).join('');
  const legend = comps.map(([n, o, col]) => `<div class="lrow">
      <span class="dot" style="background:${col}"></span>
      <span class="lname">${n}</span>
      <span class="lval ${cls(o.value)}">${o.value > 0 ? '+' : ''}${o.value.toFixed(2)}%p</span>
      <span class="lshare">${(o.share*100).toFixed(0)}%</span>
    </div>`).join('');
  parts.push(`<div class="card"><h2>등락률 분해</h2>
    <div class="bar">${segs}</div><div class="legend">${legend}</div>
    <div class="meta">
      <span class="tag">${esc(d.context.index_name)} ${d.context.index_rate != null ? (d.context.index_rate > 0 ? '+' : '') + d.context.index_rate.toFixed(2) + '%' : '-'}</span>
      ${d.context.sector_rate != null ? `<span class="tag">업종 ${(d.context.sector_rate > 0 ? '+' : '') + d.context.sector_rate.toFixed(2)}%</span>` : ''}
      ${d.context.peers.map(p => `<span class="tag">${esc(p.name)} ${(p.change_rate > 0 ? '+' : '') + p.change_rate.toFixed(2)}%</span>`).join('')}
    </div></div>`);

  // 수급 · 공매도
  const supplyCard = renderSupply(d);
  if (supplyCard) parts.push(supplyCard);

  // 정황
  if (a.signals.length) {
    parts.push(`<div class="card"><h2>정황</h2><ul class="signals">
      ${a.signals.map(s => `<li>${esc(s.text)}</li>`).join('')}</ul></div>`);
  }

  // 뉴스
  if (d.news && d.news.length) {
    parts.push(`<div class="card"><h2>관련 뉴스</h2><div class="news">
      ${d.news.slice(0, 10).map(n => `<a href="${esc(n.url || '#')}" target="_blank" rel="noopener">
        <span class="ntime">${esc(n.time)}</span>
        <span class="ntitle">${esc(n.title)}</span>
        <span class="ncat">${esc((n.categories || []).join('/'))}</span></a>`).join('')}
    </div></div>`);
  }

  out.innerHTML = parts.join('');
  const rf = document.getElementById('rf');
  if (rf) rf.addEventListener('click', () => form.requestSubmit());
  loadUsage();
}

const INVESTOR_LABEL = { foreign: '외국인', institution: '기관', individual: '개인' };

/**
 * 수급·공매도 카드.
 *
 * 숫자보다 '언제 기준인지'를 먼저 보여준다. 오늘 수급은 잠정치이고 공매도는
 * 장 마감 후에 나오므로, 날짜 없이 숫자만 띄우면 어제 값을 오늘 원인으로 읽게 된다.
 */
function renderSupply(d) {
  const s = d.context.supply;
  if (!s || (!s.flow && !s.short)) return '';
  const price = d.quote.price;
  const rows = [];

  if (s.flow) {
    const f = s.flow;
    // 수량(주)으로 오면 현재가를 곱해 억원으로 환산한다 — 어디까지나 추정치다.
    const eok = v => v == null ? null : (f.unit === '원' ? v : (price ? v * price : null)) / 1e8;
    for (const key of ['foreign', 'institution', 'individual']) {
      const v = eok(f[key]);
      if (v == null) continue;
      rows.push(`<div class="lrow"><span class="lname">${INVESTOR_LABEL[key]}</span>
        <span class="lval ${cls(v)}">${v > 0 ? '+' : ''}${Math.round(v).toLocaleString('ko-KR')}억</span></div>`);
    }
    const stamp = s.fresh
      ? (f.provisional ? '오늘 · 장중 잠정치' : '오늘 · 확정')
      : `${f.date || '날짜 미상'} 기준 (오늘 수급은 아직 집계 전)`;
    rows.push(`<div class="meta"><span class="tag">${esc(stamp)}</span>
      ${f.unit === '주' ? '<span class="tag">수량x현재가 환산</span>' : ''}
      ${s.streak_days >= 2 ? `<span class="tag">외국인 ${s.streak_days}일 연속 ${s.streak_total > 0 ? '순매수' : '순매도'}</span>` : ''}
      ${f.foreign_hold_ratio != null ? `<span class="tag">외국인 보유율 ${f.foreign_hold_ratio.toFixed(2)}%</span>` : ''}
    </div>`);
  }

  if (s.short && s.short.ratio != null) {
    rows.push(`<div class="lrow"><span class="lname">공매도 비중</span>
      <span class="lval">${s.short.ratio.toFixed(2)}%</span>
      <span class="lshare">${s.short_baseline ? '평균 ' + s.short_baseline.toFixed(1) + '%' : ''}</span></div>`);
    rows.push(`<div class="meta"><span class="tag">${s.short_fresh ? '당일'
      : esc(s.short.date || '날짜 미상') + ' 기준 · 당일 공매도는 장 마감 후 공시'}</span></div>`);
  }

  return rows.length ? `<div class="card"><h2>수급 · 공매도</h2><div class="legend">${rows.join('')}</div></div>` : '';
}

// 누적 사용량. 1회 비용은 감이 안 오고, 정작 궁금한 건 "이번 달 얼마"다.
async function loadUsage() {
  const el = document.getElementById('usage');
  if (!el) return;
  try {
    const tk = token();
    const r = await fetch('/api/usage', tk ? { headers: { 'X-Token': tk } } : undefined);
    if (!r.ok) return;
    const u = await r.json();
    const [today, , total] = u.buckets;
    if (!total.calls) return;
    let line = `누적 ${total.calls}회 · ${nf(Math.round(total.krw))}원`;
    if (today.calls) line = `오늘 ${today.calls}회 · ${nf(Math.round(today.krw))}원　|　` + line;
    if (u.projected_monthly_krw) {
      line += `　|　이 패턴이면 월 ${nf(u.projected_monthly_krw)}원 예상`;
    }
    el.textContent = line;
  } catch (e) { /* 사용량 표시 실패가 분석을 막지 않는다 */ }
}

// 데스크톱 앱(.exe)에서만 종료 버튼을 띄운다. 폰이나 사내망에 열어둔 서버는
// can_quit 가 false 라 버튼 자체가 나오지 않는다.
async function setupQuit() {
  try {
    const h = await (await fetch('/api/health')).json();
    if (!h.can_quit) return;
    const bar = document.getElementById('quitBar');
    bar.style.display = '';
    document.getElementById('quitBtn').onclick = async () => {
      if (!confirm('앱을 종료합니다. 이 탭도 닫으시면 됩니다.')) return;
      try { await fetch('/api/quit', { method: 'POST' }); } catch (e) { /* 종료되면 응답이 끊긴다 */ }
      bar.innerHTML = '<span>종료했습니다. 이 탭을 닫으세요.</span>';
    };
  } catch (e) { /* health 를 못 읽어도 분석은 된다 */ }
}
setupQuit();

// 홈 화면 설치 + 즉시 실행용. 시세는 캐시하지 않는다(sw.js 참고).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
