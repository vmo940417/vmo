<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>왜 움직여</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --line:#262d38; --fg:#e6edf3;
    --dim:#8b98a5; --faint:#5c6773; --up:#f0616d; --down:#4a9eff; --accent:#d6a44c;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg); line-height:1.6;
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    padding: calc(env(safe-area-inset-top,0px) + 16px) 14px
             calc(env(safe-area-inset-bottom,0px) + 40px);
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  h1 { font-size:17px; font-weight:700; margin:0; flex:1; letter-spacing:-.3px; }
  .gear { background:none; border:0; color:var(--dim); font-size:20px; padding:4px 8px; }

  form { display:flex; gap:8px; margin-bottom:10px; }
  input[type=text] {
    flex:1; padding:14px; font-size:16px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel); color:var(--fg);
  }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button.go {
    padding:0 20px; font-size:15px; font-weight:600; border:0;
    border-radius:10px; background:var(--accent); color:#1a1205;
  }
  button:disabled { opacity:.5; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .chip { padding:6px 11px; font-size:12.5px; border-radius:999px;
          border:1px solid var(--line); background:transparent; color:var(--dim); }

  .card { background:var(--panel); border:1px solid var(--line);
          border-radius:13px; padding:16px; margin-bottom:12px; }
  .ticker { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .tname { font-size:19px; font-weight:700; }
  .tcode { color:var(--faint); font-size:12.5px; }
  .tprice { margin-left:auto; font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; }
  .tchg { font-size:14px; text-align:right; font-variant-numeric:tabular-nums; }
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}

  .answer { font-size:16px; font-weight:600; line-height:1.55; margin:0 0 12px; }
  .reason { padding:8px 0; border-top:1px solid var(--line); }
  .rpoint { font-size:13px; font-weight:600; color:var(--accent); }
  .rdetail { font-size:14px; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .tag { font-size:11.5px; padding:4px 9px; border-radius:6px;
         background:var(--bg); border:1px solid var(--line); color:var(--dim); }

  h2 { font-size:12px; font-weight:700; color:var(--dim); margin:0 0 10px;
       text-transform:uppercase; letter-spacing:.6px; }
  .bar { display:flex; height:28px; border-radius:7px; overflow:hidden;
         background:var(--bg); margin-bottom:10px; }
  .seg { display:flex; align-items:center; justify-content:center;
         font-size:11px; font-weight:700; color:#0e1116; min-width:2px; }
  .lrow { display:flex; align-items:center; gap:8px; font-size:13.5px; padding:3px 0; }
  .dot { width:10px; height:10px; border-radius:3px; flex:none; }
  .lname { flex:1; }
  .lval { font-variant-numeric:tabular-nums; font-weight:600; }
  .lshare { color:var(--faint); font-size:12px; width:40px; text-align:right; }

  ul.signals { list-style:none; padding:0; margin:0; }
  ul.signals li { font-size:13.5px; color:var(--dim); padding:6px 0 6px 13px;
                  position:relative; }
  ul.signals li::before { content:"·"; position:absolute; left:2px; color:var(--accent); }

  .news a { display:block; padding:8px 0; border-top:1px solid var(--line);
            text-decoration:none; color:var(--fg); font-size:13.5px; }
  .news a:first-child { border-top:0; }
  .ntime { color:var(--faint); font-variant-numeric:tabular-nums; margin-right:8px; }
  .ncat { color:var(--faint); font-size:11.5px; }

  .status { text-align:center; color:var(--dim); padding:32px 0; font-size:14px; }
  .err { color:var(--up); }
  .spin { display:inline-block; width:14px; height:14px; vertical-align:-2px;
          border:2px solid var(--line); border-top-color:var(--accent);
          border-radius:50%; animation:r .7s linear infinite; margin-right:8px; }
  @keyframes r { to { transform:rotate(360deg); } }

  /* 설정 시트 */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
           align-items:flex-end; z-index:10; }
  .sheet.on { display:flex; }
  .sheet-inner { background:var(--panel); width:100%; border-radius:16px 16px 0 0;
                 padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);
                 max-height:88vh; overflow-y:auto; }
  label { display:block; font-size:12.5px; color:var(--dim); margin:14px 0 5px; }
  .sheet input { width:100%; padding:12px; font-size:15px; border-radius:9px;
                 border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .sheet .go { width:100%; padding:14px; margin-top:18px; }
  .hint { font-size:11.5px; color:var(--faint); margin-top:6px; line-height:1.6; }
  .foot { color:var(--faint); font-size:11.5px; text-align:center; margin-top:18px;
          line-height:1.7; }
</style>
</head>
<body>
  <div class="top">
    <h1>왜 움직여</h1>
    <button class="gear" id="openSet" aria-label="설정">⚙</button>
  </div>

  <form id="f">
    <input type="text" id="q" placeholder="종목명 또는 코드" autocomplete="off"
           enterkeyhint="search">
    <button type="submit" class="go" id="go">분석</button>
  </form>
  <div class="chips" id="chips"></div>

  <div id="out"></div>
  <div class="foot" id="usage"></div>
  <div class="foot">
    시세·뉴스는 네이버 금융에서 수집하며 지연될 수 있습니다.<br>
    정보 제공용 분석이며 투자 판단의 근거로 삼지 마십시오.
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-inner">
      <h2>설정</h2>

      <label for="key">Claude API 키 (선택)</label>
      <input type="password" id="key" placeholder="sk-ant-..." autocomplete="off">
      <div class="hint">
        비워두면 규칙 기반 분석만 합니다 — 분해·타이밍·정황·뉴스는 그대로 나오고
        비용도 들지 않습니다. 키를 넣으면 뉴스를 읽고 원인을 서술하는 단계가 추가됩니다
        (1회 약 10~15원).
      </div>

      <label for="model">모델</label>
      <input type="text" id="model" placeholder="claude-sonnet-5">
      <div class="hint">비우면 claude-sonnet-5. 더 깊은 판단은 claude-opus-5.</div>

      <label for="rate">비용 표시 환율 (원/달러)</label>
      <input type="text" id="rate" inputmode="numeric" placeholder="1400">

      <button class="go" id="saveSet">저장</button>
      <div class="hint" id="usageDetail"></div>
    </div>
  </div>

<script src="tables.js"></script>
<script src="attribution.js"></script>
<script src="krx.js"></script>
<script src="naver.js"></script>
<script src="llm-prompt.js"></script>
<script src="app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const out = $('out'), form = $('f'), qEl = $('q'), goEl = $('go');
const S = App.Settings;

const nf = (n) => (n == null ? '-' : Math.round(n).toLocaleString('ko-KR'));
const cls = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const sgn = (v, d = 2) => (v > 0 ? '+' : '') + Number(v).toFixed(d);

['삼성전자','SK하이닉스','한화오션','LG에너지솔루션','알테오젠'].forEach((s) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.textContent = s;
  b.onclick = () => { qEl.value = s; form.requestSubmit(); };
  $('chips').appendChild(b);
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const query = qEl.value.trim();
  if (!query) return;
  qEl.blur();
  goEl.disabled = true;
  const say = (msg) => { out.innerHTML = `<div class="status"><span class="spin"></span>${esc(msg)}</div>`; };
  say('시작하는 중…');

  try {
    render(await App.diagnose(query, { onProgress: say }));
  } catch (err) {
    out.innerHTML = `<div class="status err">${esc(err.message)}</div>`;
  } finally {
    goEl.disabled = false;
    showUsage();
  }
});

function render(d) {
  const q = d.quote, a = d.attribution, c = a.components, exp = d.explanation;
  const parts = [];

  parts.push(`<div class="card">
    <div class="ticker">
      <span class="tname">${esc(q.name)}</span>
      <span class="tcode">${esc(q.code)} · ${esc(q.market)}${q.sector_name ? ' · ' + esc(q.sector_name) : ''}</span>
      <span class="tprice ${cls(q.change_rate)}">${nf(q.price)}</span>
    </div>
    <div class="tchg ${cls(q.change_rate)}">${sgn(q.change, 0)} (${sgn(q.change_rate)}%)</div>
    <div class="meta"><span class="tag">${d.as_of.toTimeString().slice(0,5)} 기준 · ${(d.elapsed_ms/1000).toFixed(1)}초${costLabel(d.cost)}</span></div>
  </div>`);

  let body = `<div class="card"><p class="answer">${esc(exp && exp.answer ? exp.answer : a.headline)}</p>`;
  if (exp && exp.error) {
    body += `<div class="reason"><div class="rpoint">LLM 오류</div>
             <div class="rdetail">${esc(exp.error)}</div></div>`;
  }
  for (const r of (exp && exp.reasons) || []) {
    body += `<div class="reason"><div class="rpoint">${esc(r.point)}</div>
             <div class="rdetail">${esc(r.detail)}</div></div>`;
  }
  const tags = [];
  if (exp && exp.catalyst) tags.push('촉발 재료: ' + exp.catalyst);
  if (exp && exp.watch) tags.push('체크: ' + exp.watch);
  tags.push('주도 요인: ' + a.driver_label);
  tags.push('확신도: ' + (exp && exp.confidence ? exp.confidence : a.confidence));
  body += `<div class="meta">${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div></div>`;
  parts.push(body);

  const comps = [['시장', c.market, '#4a9eff'], ['업종초과', c.sector, '#d6a44c'],
                 ['종목고유', c.idiosyncratic, '#5ec98a']];
  parts.push(`<div class="card"><h2>등락률 분해</h2>
    <div class="bar">${comps.map(([n2, o, col]) => o.share > 0.02
      ? `<div class="seg" style="width:${(o.share*100).toFixed(1)}%;background:${col}">${o.share > .13 ? n2 : ''}</div>` : '').join('')}</div>
    ${comps.map(([n2, o, col]) => `<div class="lrow">
      <span class="dot" style="background:${col}"></span><span class="lname">${n2}</span>
      <span class="lval ${cls(o.value)}">${sgn(o.value)}%p</span>
      <span class="lshare">${Math.round(o.share*100)}%</span></div>`).join('')}
    <div class="meta">
      <span class="tag">${esc(d.context.index_name)} ${d.context.index_rate != null ? sgn(d.context.index_rate) + '%' : '-'}</span>
      ${d.context.sector_rate != null ? `<span class="tag">업종 ${sgn(d.context.sector_rate)}%</span>` : ''}
      ${d.context.peers.map((p) => `<span class="tag">${esc(p.name)} ${sgn(p.change_rate)}%</span>`).join('')}
    </div></div>`);

  const supplyCard = renderSupply(d);
  if (supplyCard) parts.push(supplyCard);

  if (a.signals.length) {
    parts.push(`<div class="card"><h2>정황</h2><ul class="signals">
      ${a.signals.map((s) => `<li>${esc(s.text)}</li>`).join('')}</ul></div>`);
  }
  if (d.news.length) {
    parts.push(`<div class="card"><h2>관련 뉴스</h2><div class="news">
      ${d.news.slice(0,10).map((n2) => `<a href="${esc(n2.url||'#')}" target="_blank" rel="noopener">
        <span class="ntime">${esc(n2.time)}</span>${esc(n2.title)}
        ${n2.categories.length ? `<span class="ncat"> ${esc(n2.categories.join('/'))}</span>` : ''}</a>`).join('')}
    </div></div>`);
  }

  const failed = d.diagnostics.failed || [];
  const samples = d.diagnostics.samples || {};
  if (failed.length || Object.keys(samples).length) {
    parts.push(`<div class="card"><h2>수집 실패</h2><ul class="signals">
      ${failed.map((x) => `<li>${esc(x.endpoint)}: ${esc(x.error)}</li>`).join('')}
      ${Object.keys(samples).map((k) => `<li>${esc(k)}: 응답은 왔지만 형태가 달라 읽지 못했습니다
        <br><span style="font-size:11px;word-break:break-all">${esc(samples[k])}</span></li>`).join('')}
    </ul></div>`);
  }

  out.innerHTML = parts.join('');
}

/**
 * 수급·공매도 카드.
 *
 * 숫자보다 '언제 기준인지'를 먼저 보여준다. 오늘 수급은 잠정치이고 공매도는
 * 장 마감 후에 나오므로, 날짜 없이 숫자만 띄우면 어제 값을 오늘 원인으로 읽게 된다.
 */
function renderSupply(d) {
  const s = d.context.supply;
  if (!s || (!s.today && !s.short)) return '';
  const A = Attribution;
  const price = d.quote.price;
  const rows = [];

  if (s.today) {
    const f = s.today;
    const fresh = A.isFresh(s);
    for (const key of ['foreign', 'institution', 'individual']) {
      if (f[key] == null) continue;
      const eok = A.toEok(f[key], f.unit, price);
      rows.push(`<div class="lrow"><span class="lname">${A.INVESTOR_LABEL[key]}</span>
        <span class="lval ${cls(eok)}">${eok == null ? '-' : sgn(eok, 0) + '억'}</span></div>`);
    }
    const st = A.streak(s, 'foreign');
    const stamp = fresh
      ? (f.provisional ? '오늘 · 장중 잠정치' : '오늘 · 확정')
      : `${f.date || '날짜 미상'} 기준 (오늘 수급은 아직 집계 전)`;
    rows.push(`<div class="meta"><span class="tag">${esc(stamp)}</span>
      ${f.unit === '주' ? '<span class="tag">수량x현재가 환산</span>' : ''}
      ${st.days >= 2 ? `<span class="tag">외국인 ${st.days}일 연속 ${st.total > 0 ? '순매수' : '순매도'}</span>` : ''}
      ${f.foreign_hold_ratio != null ? `<span class="tag">외국인 보유율 ${f.foreign_hold_ratio.toFixed(2)}%</span>` : ''}
    </div>`);
  }

  if (s.short && s.short.ratio != null) {
    const base = A.shortBaseline(s);
    rows.push(`<div class="lrow"><span class="lname">공매도 비중</span>
      <span class="lval">${s.short.ratio.toFixed(2)}%</span>
      <span class="lshare">${base ? '평균 ' + base.toFixed(1) + '%' : ''}</span></div>`);
    rows.push(`<div class="meta"><span class="tag">${A.shortIsFresh(s) ? '당일'
      : esc(s.short.date || '날짜 미상') + ' 기준 · 당일 공매도는 장 마감 후 공시'}</span></div>`);
  }

  return rows.length ? `<div class="card"><h2>수급 · 공매도</h2>${rows.join('')}</div>` : '';
}

function costLabel(c) {
  if (!c) return ' · LLM 미사용';
  if (c.usd == null) return ` · ${nf(c.total_tokens)} 토큰`;
  return ` · ${nf(c.input_tokens)}+${nf(c.output_tokens)} 토큰 · ${Math.round(c.krw)}원`;
}

function showUsage() {
  const u = App.Usage.summary();
  if (!u.total.calls) { $('usage').textContent = ''; $('usageDetail').textContent = ''; return; }
  let line = `오늘 ${u.today.calls}회 · ${nf(u.today.krw)}원　|　누적 ${u.total.calls}회 · ${nf(u.total.krw)}원`;
  if (u.projectedMonthlyKrw) line += `　|　이 패턴이면 월 ${nf(u.projectedMonthlyKrw)}원 예상`;
  $('usage').textContent = line;
  $('usageDetail').textContent = `누적 ${u.total.calls}회 · $${u.total.usd.toFixed(4)} (약 ${nf(u.total.krw)}원) · ${u.activeDays}일 사용`;
}

// 설정 시트
$('openSet').onclick = () => {
  $('key').value = S.get('api_key');
  $('model').value = S.get('model');
  $('rate').value = S.get('usd_krw');
  showUsage();
  $('sheet').classList.add('on');
};
$('sheet').onclick = (e) => { if (e.target === $('sheet')) $('sheet').classList.remove('on'); };
$('saveSet').onclick = () => {
  S.set('api_key', $('key').value.trim());
  S.set('model', $('model').value.trim());
  S.set('usd_krw', $('rate').value.trim());
  $('sheet').classList.remove('on');
};

showUsage();
</script>
</body>
</html>
