name: 매일 쇼츠 자동 생성 & 업로드

on:
  schedule:
    # 목표: 매일 03:00 KST 공개.
    #
    # GitHub Actions의 schedule(cron) 트리거는 정시 실행을 보장하지 않는다 - 특히
    # 매 시 정각(:00)에 요청이 몰릴 때는 몇 분에서 길게는 몇 시간까지 지연될 수 있다고
    # GitHub가 공식 문서에 명시한다 (실제로 2026-08-26 실행에서 예정보다 2시간 지연된 것을
    # 확인함). 이 지연이 목표 공개 시각(03:00 KST)을 넘겨버리면 upload_youtube.py의
    # _compute_publish_at()이 "이미 지났다"고 판단해 예약 공개 대신 즉시 공개로 처리한다.
    #
    # 그래서 워크플로우 자체는 "정시 발동"이 아니라 "충분히 일찍 발동해서, 유튜브의
    # publishAt 예약 공개 기능이 정확한 03:00 KST에 실제로 세상에 내보내도록" 하는 것이
    # 목표다. UTC 15:07 = KST 00:07(다음날)에 실행해 목표 시각까지 약 3시간 버퍼를
    # 두고, 혼잡이 몰리는 정각(:00)을 피해 :07에 실행한다.
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 영상만 생성하고 유튜브 업로드는 건너뜁니다"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시스템 패키지 설치 (ffmpeg, 한글 폰트)
        timeout-minutes: 5
        env:
          # DEBIAN_FRONTEND를 지정하지 않으면 일부 패키지의 debconf 프롬프트(예: 시간대 설정)가
          # 입력을 기다리며 무한 대기해 워크플로우가 멈출 수 있다. 비대화형 모드로 고정한다.
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-nanum fontconfig
          fc-cache -f

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/run_daily.py

      - name: 생성된 영상/썸네일 아티팩트 업로드 (확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-output
          path: |
            output/*.mp4
            output/*.jpg
            output/script.json
          retention-days: 7
          if-no-files-found: ignore

      - name: 사용 이력(state/history.json) 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 오늘의 업로드 이력 갱신 [skip ci]"
            git push
          else
            echo "변경된 이력이 없습니다."
          fi
