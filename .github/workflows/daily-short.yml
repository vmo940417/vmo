name: 매일 쇼츠 자동 생성 & 업로드

on:
  schedule:
    # 목표: 매일 03:00 KST 공개.
    #
    # GitHub Actions의 schedule(cron) 트리거는 정시 실행을 보장하지 않는다. 실제
    # 운영에서 2시간, 심하면 9시간 가까이 지연되는 것을 확인했다 (매 시 정각(:00)에
    # 요청이 몰릴 때 특히 심하다고 GitHub 공식 문서에도 명시돼 있음). 그래서 "버퍼를
    # 두고 정시 전에 끝내기"만으로는 지연을 다 못 피한다 - 실제 정시 공개는
    # upload_youtube.py의 _compute_publish_at()이 "오늘 목표 시각이 지났으면 내일
    # 같은 시각으로" 예약을 넘기는 방식으로 보장한다 (이 워크플로우가 몇 시에
    # 실행되든 상관없이 항상 다음 03:00에만 공개됨).
    #
    # 이 cron은 그래도 최대한 목표 시각과 가깝게 맞추기 위한 것일 뿐, 실제 정시
    # 공개의 핵심 안전장치는 아니다. UTC 15:07 = KST 00:07(다음날)에 실행하고,
    # 혼잡이 몰리는 정각(:00)을 피해 :07에 실행한다.
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 영상만 생성하고 유튜브 업로드는 건너뜁니다"
        type: boolean
        default: false
      publish_now:
        description: "true면 예약 없이 지금 바로 공개합니다 (결과를 바로 확인하고 싶은 수동 테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시스템 패키지 설치 (ffmpeg, 한글 폰트)
        timeout-minutes: 5
        env:
          # DEBIAN_FRONTEND를 지정하지 않으면 일부 패키지의 debconf 프롬프트(예: 시간대 설정)가
          # 입력을 기다리며 무한 대기해 워크플로우가 멈출 수 있다. 비대화형 모드로 고정한다.
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-nanum fontconfig
          fc-cache -f

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          PUBLISH_NOW: ${{ inputs.publish_now == true && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/run_daily.py

      - name: 생성된 영상/썸네일 아티팩트 업로드 (확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-output
          path: |
            output/*.mp4
            output/*.jpg
            output/script.json
          retention-days: 7
          if-no-files-found: ignore

      - name: 사용 이력(state/history.json) 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 오늘의 업로드 이력 갱신 [skip ci]"
            git push
          else
            echo "변경된 이력이 없습니다."
          fi
