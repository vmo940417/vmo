name: "[실험] 누리 립싱크 테스트"

# 정식 파이프라인(daily-short.yml)과는 완전히 별개의 워크플로우다. 트리거도
# workflow_dispatch뿐이라 자동으로는 절대 실행되지 않고, 기존 03:00 자동 업로드와
# 겹치거나 간섭할 일이 없다. 누리 사진 한 장으로 립싱크 품질만 확인해보는 일회성 실험용.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lipsync-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg 설치
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 의존성 설치
        run: pip install edge-tts Pillow requests

      - name: 립싱크 테스트 실행
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: PYTHONPATH=. python3 scripts/_lipsync_test.py assets/nuri/01.jpg
