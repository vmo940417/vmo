name: Windows 데스크톱 앱

# APK 와 같은 이유로 여기(GitHub 러너)에서 빌드한다. 윈도우 실행 파일은
# 윈도우에서만 만들 수 있는데 개발 컨테이너는 리눅스다.

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # lite 서버(표준 라이브러리)로 돌기 때문에 fastapi/uvicorn/anthropic 은
      # 넣지 않는다. 실행 파일이 작아지고 백신 오탐도 준다.
      - name: Install build deps
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install httpx python-dotenv truststore pyinstaller

      - name: Build exe
        working-directory: app
        run: pyinstaller --clean --noconfirm packaging/stockwhy.spec

      # 1) 서버·번들 검증. 실행 파일은 소스와 리소스 경로가 달라서
      #    "빌드는 됐는데 화면이 404" 가 가장 흔한 실패다.
      #    창을 끄고(STOCKWHY_NO_WINDOW) 돌려서, 실패했을 때 서버 문제인지
      #    창 문제인지 헷갈리지 않게 한다.
      - name: Smoke test - 서버
        working-directory: app
        shell: pwsh
        env:
          STOCKWHY_NO_WINDOW: "1"
        run: |
          # 프로브 실패는 '아직 안 떴다'는 정상 신호다. PowerShell 7 은 타임아웃을
          # WebException 이 아니라 HttpRequestException 으로 던지므로 형을 지정해
          # 잡으면 안 걸리고, Actions 가 ErrorActionPreference=Stop 을 켜 두기 때문에
          # 그대로 스텝이 죽는다. 그래서 형 없이 잡는다.
          $exe = Start-Process -FilePath dist\stockwhy.exe -PassThru
          $ok = $false
          try {
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              foreach ($port in 8765,8766,8767,8768) {
                try {
                  $h = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 3 -ErrorAction Stop
                } catch {
                  continue
                }
                if (-not $h.ok) { continue }
                Write-Host "health($port): $($h | ConvertTo-Json -Compress)"

                $page = Invoke-WebRequest "http://127.0.0.1:$port/" -TimeoutSec 10 -ErrorAction Stop
                if ($page.StatusCode -ne 200) { throw "index 응답 $($page.StatusCode)" }
                if ($page.Content -notmatch '/api/why') { throw "index 내용이 앱 화면이 아님" }

                $icon = Invoke-WebRequest "http://127.0.0.1:$port/static/icons/favicon.png" -TimeoutSec 10 -ErrorAction Stop
                if ($icon.StatusCode -ne 200) { throw "정적 파일이 안 묶임" }

                # 종목 조회 경로까지. 러너에서 네이버가 막혀 있어도 404 JSON 이
                # 와야 정상이다(500 이나 무응답이면 파이프라인이 깨진 것).
                try {
                  Invoke-RestMethod "http://127.0.0.1:$port/api/why?q=005930&llm=0" -TimeoutSec 60 -ErrorAction Stop | Out-Null
                  Write-Host "  종목 조회: 성공(러너에서 네이버 접근됨)"
                } catch {
                  $code = $_.Exception.Response.StatusCode.value__
                  if ($code -ne 404) { throw "종목 조회가 $code 로 실패" }
                  Write-Host "  종목 조회: 404(러너에서 네이버 차단 — 예상된 결과)"
                }

                $ok = $true
                break
              }
              if ($ok) { break }
            }
          } finally {
            # onefile 실행 파일은 부트로더(부모)가 실제 앱(자식)을 따로 띄운다.
            # $exe.Id 만 죽이면 자식이 살아남아 포트를 계속 쥐고 있고, 다음
            # 단계에서 시작한 앱이 "이미 떠 있네" 하고 브라우저만 열고 끝난다.
            # 이름으로 전부 잡는다.
            Get-Process stockwhy -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            foreach ($i in 1..10) {
              if (-not (Get-Process stockwhy -ErrorAction SilentlyContinue)) { break }
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ok) { throw "실행 파일이 서버를 띄우지 못했습니다" }
          Write-Host "서버 스모크 테스트 통과"

      # 2) 창까지 띄우는 실제 경로. tkinter 가 죽으면 콘솔이 없어서 아무 메시지도
      #    안 나오고 프로세스만 조용히 사라진다 — 사용자에겐 '눌렀는데 아무 일도
      #    안 일어남' 으로 보이는, 이 빌드에서 가장 알아채기 어려운 실패다.
      - name: Smoke test - 창
        working-directory: app
        shell: pwsh
        run: |
          # 앞 단계의 잔여 프로세스가 남아 있으면 새로 띄운 앱이 "이미 떠 있네"
          # 하고 브라우저만 열고 정상 종료해버린다. 그러면 이 검사는 의미가 없다.
          if (Get-Process stockwhy -ErrorAction SilentlyContinue) {
            throw "앞 단계의 프로세스가 아직 살아 있습니다 — 정리가 안 됐습니다"
          }

          Start-Process -FilePath dist\stockwhy.exe | Out-Null
          Start-Sleep -Seconds 20
          try {
            # 부모/자식 어느 쪽이든 살아 있으면 앱이 떠 있는 것이다.
            if (-not (Get-Process stockwhy -ErrorAction SilentlyContinue)) {
              throw "창을 띄우자마자 종료됐습니다 (tkinter 실패 추정)"
            }
            $alive = $false
            foreach ($port in 8765,8766,8767,8768) {
              try {
                $h = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 3 -ErrorAction Stop
                if ($h.ok) { $alive = $true; break }
              } catch { continue }
            }
            if (-not $alive) { throw "프로세스는 살아 있는데 서버가 응답하지 않습니다" }
            Write-Host "창 스모크 테스트 통과"
          } finally {
            Get-Process stockwhy -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      # 러너에서는 네이버가 열려 있다(위 스모크 테스트에서 실제 조회 성공).
      # 개발 컨테이너는 403 이라 수급·공매도 엔드포인트의 실제 응답 모양을
      # 확인할 방법이 없었는데, 여기서는 볼 수 있다. 읽지 못한 응답은
      # report.samples 에 앞부분이 찍히므로 그걸 보고 파서를 맞춘다.
      # 진단일 뿐이라 실패해도 릴리스를 막지 않는다.
      - name: 데이터 소스 진단 (수급·공매도 응답 확인)
        working-directory: app
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m server.cli --selftest

      # 일회성 진단. KRX 공매도의 화면 코드(bld)와 파라미터 조합을 격자로 훑는다.
      # 정답을 찾아 krx.py 에 반영하면 이 단계와 tools/probe_krx.py 는 지운다.
      - name: KRX 공매도 엔드포인트 탐침
        working-directory: app
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python tools/probe_krx.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: stockwhy-windows
          path: app/dist/stockwhy.exe
          if-no-files-found: error
          retention-days: 90

      # 릴리스에 올려 링크 하나로 받게 한다. 아티팩트는 로그인해야 받을 수 있고
      # zip 으로 감싸여 있어서 "받아서 더블클릭" 이 안 된다.
      - name: Publish to rolling release
        if: github.ref == 'refs/heads/claude/stock-price-analysis-app-i9ddfj'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete desktop-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create desktop-latest app/dist/stockwhy.exe \
            --title "왜 움직여 — 윈도우 데스크톱 앱" \
            --prerelease \
            --notes "커밋 \`${GITHUB_SHA:0:7}\` 빌드.

          **설치 없음**: \`stockwhy.exe\` 를 받아서 더블클릭하면 됩니다.
          PowerShell 도, 파이썬 설치도 필요 없습니다.

          처음 실행하면 Windows SmartScreen 이 '알 수 없는 게시자'라고 막습니다.
          코드 서명 인증서가 없어서 나는 정상적인 경고입니다.
          '추가 정보' -> '실행'을 누르세요.

          서버는 127.0.0.1 에만 열리므로 다른 PC 에서는 접근할 수 없습니다."
