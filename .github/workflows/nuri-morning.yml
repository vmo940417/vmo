name: "매일 누리의 아침 인사"

# 기존 daily-short.yml(매일 명언 영상, 03:00 KST)과 완전히 분리된 워크플로우다.
# 목적/이름이 다른 별개의 워크플로우 파일이라 서로의 concurrency group에 걸리지 않고,
# OUTPUT_DIR/STATE_DIR도 아예 다른 경로(output_nuri/, state_nuri/)를 써서 결과물이나
# 이력 파일이 겹칠 일도 없다.
#
# 목표 공개 시각은 05:00 KST. daily-short.yml과 같은 이유로, 이 cron 자체는 "그 시각
# 전에만 끝나면 되는" 보조 장치일 뿐이고, 실제 정시 공개는 upload_nuri.py가 재사용하는
# _compute_publish_at()의 "목표 시각이 지났으면 항상 다음 목표 시각으로 예약" 로직이
# 담당한다.
on:
  schedule:
    # UTC 17:07 = KST 02:07, 05:00 KST 목표보다 약 3시간 앞서 실행 시도.
    - cron: "7 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 영상만 생성하고 유튜브 업로드는 건너뜁니다"
        type: boolean
        default: false
      publish_now:
        description: "true면 예약 없이 지금 바로 공개합니다 (결과를 바로 확인하고 싶은 수동 테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nuri-morning
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시스템 패키지 설치 (ffmpeg, 한글 폰트)
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-nanum fontconfig
          fc-cache -f

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          PUBLISH_NOW: ${{ inputs.publish_now == true && '1' || '' }}
          OUTPUT_DIR: output_nuri
          STATE_DIR: state_nuri
          PUBLISH_TIME_LOCAL: "05:00"
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/run_nuri_daily.py

      - name: 생성된 영상/썸네일 아티팩트 업로드 (확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuri-morning-output
          path: |
            output_nuri/*.mp4
            output_nuri/*.jpg
            output_nuri/script.json
          retention-days: 7
          if-no-files-found: ignore

      - name: 사용 이력(state_nuri/history.json) 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_nuri/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 누리의 아침 인사 업로드 이력 갱신 [skip ci]"
            git push
          else
            echo "변경된 이력이 없습니다."
          fi
