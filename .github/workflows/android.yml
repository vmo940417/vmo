name: Android APK

# APK 는 여기(GitHub 러너)에서 빌드한다. 개발 컨테이너는 dl.google.com 이 막혀
# 있어 Android SDK 를 받을 수 없기 때문이다. 러너에는 SDK 가 미리 깔려 있다.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/stockwhy.apk
          ls -la out/

      # 디버그 APK 라 별도 서명 없이 바로 사이드로드해서 설치할 수 있다.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockwhy-apk
          path: android/out/stockwhy.apk
          if-no-files-found: error
          retention-days: 90
