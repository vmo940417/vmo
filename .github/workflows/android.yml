name: Android APK

# APK 는 여기(GitHub 러너)에서 빌드한다. 개발 컨테이너는 dl.google.com 이 막혀
# 있어 Android SDK 를 받을 수 없기 때문이다. 러너에는 SDK 가 미리 깔려 있다.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/stockwhy.apk
          ls -la out/

      # 디버그 APK 라 별도 서명 없이 바로 사이드로드해서 설치할 수 있다.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockwhy-apk
          path: android/out/stockwhy.apk
          if-no-files-found: error
          retention-days: 90

      # 릴리스에도 올린다. 아티팩트는 zip 으로 감싸여 있고 로그인해야 받을 수 있어
      # 폰에서 설치하기 불편하다. 릴리스 자산은 raw .apk 라 링크를 탭하면 바로 받는다.
      - name: Publish to rolling release
        if: github.ref == 'refs/heads/claude/stock-price-analysis-app-i9ddfj'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest android/out/stockwhy.apk \
            --title "왜 움직여 — 최신 APK" \
            --prerelease \
            --notes "커밋 \`${GITHUB_SHA:0:7}\` 빌드.

          **설치**: 아래 \`stockwhy.apk\` 를 폰에서 받아 실행하세요.
          '출처를 알 수 없는 앱' 설치를 한 번 허용해야 합니다.

          서명되지 않은 디버그 빌드라 Play 스토어를 거치지 않습니다."
