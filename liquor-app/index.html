<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15110f" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="술사전" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>술사전</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;800&family=Shippori+Mincho:wght@600;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="back hidden" id="backBtn" aria-label="뒤로">‹</button>
    <h1 id="title"><span class="seal"></span>술사전</h1>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="search" class="active">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>검색</span>
    </button>
    <button data-tab="browse">
      <svg viewBox="0 0 24 24"><path d="M8 3h8l-.6 6.2a3.4 3.4 0 0 1-6.8 0z"/><path d="M12 13v7M8.5 21h7"/></svg><span>분류</span>
    </button>
    <button data-tab="camera" class="cam">
      <span class="bubble" aria-label="카메라로 검색"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.3" r="3.4"/></svg></span><span>촬영</span>
    </button>
    <button data-tab="ranking">
      <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7"/></svg><span>랭킹</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><span>설정</span>
    </button>
  </nav>

  <div class="toast hidden" id="toast"></div>
  <input id="camInput" type="file" accept="image/*" capture="environment" class="hidden" />

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="data-extra.js"></script>
  <script src="data-bulk-1.js"></script>
  <script src="data-bulk-2.js"></script>
  <script src="data-bulk-3.js"></script>
  <script src="data-bulk-4.js"></script>
  <script src="data-bulk-5.js"></script>
  <script src="data-bulk-6.js"></script>
  <script src="data-bulk-7.js"></script>
  <script src="data-scores.js"></script>
  <script src="data-price.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
